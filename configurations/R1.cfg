! =====================================================================
! R1 - MAIN ROUTER
! Sanitized LAB configuration (sample) - NOT a backup of a real device.
! Target platform : Cisco IOSv 15.x (GNS3 / EVE-NG / Cisco CML)
! Status          : Lab-ready. Not verified on physical hardware.
!
! Before use:
!   * Replace every CHANGE_ME value with your own strong secret.
!   * Adapt 192.168.150.0/24 to YOUR lab management network.
!   * Never commit real passwords to Git.
! =====================================================================
!
hostname R1
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
no ip domain-lookup
ip domain-name lab.local
!
! --- Local accounts (scrypt = type 9 hash) ---------------------------
enable algorithm-type scrypt secret CHANGE_ME_ENABLE_SECRET
username netadmin privilege 15 algorithm-type scrypt secret CHANGE_ME_ADMIN_PASSWORD
!
! --- SSH --------------------------------------------------------------
! RSA keys must exist before SSH v2 can be enabled. This command is
! executed once and is NOT shown in show running-config.
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
! Block logins for 120 s after 3 failures within 60 s
login block-for 120 attempts 3 within 60
!
! --- Interfaces -------------------------------------------------------
interface Loopback0
 description Router-ID
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description WAN link to R2 Gi0/0
 ip address 10.0.12.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/1
 description Trunk to SW1 Gi0/0 (router-on-a-stick)
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.10
 description Gateway VLAN 10 - USERS
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
!
interface GigabitEthernet0/1.20
 description Gateway VLAN 20 - SERVERS
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
!
interface GigabitEthernet0/2
 description UNUSED
 no ip address
 shutdown
!
interface GigabitEthernet0/3
 description Out-of-band management (example subnet 192.168.150.0/24)
 ip address 192.168.150.101 255.255.255.0
 no shutdown
!
! --- OSPF -------------------------------------------------------------
! Management interface Gi0/3 is intentionally NOT advertised in OSPF.
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
!
! --- Management access control -----------------------------------------
ip access-list standard MGMT-SSH
 permit 192.168.150.0 0.0.0.255
 deny   any log
!
no ip http server
no ip http secure-server
!
! --- Time and logging ----------------------------------------------------
! 192.168.150.10 = example NTP server, 192.168.150.20 = example syslog server
ntp server 192.168.150.10
logging host 192.168.150.20
logging trap informational
!
banner motd # Authorized access only. All activity is monitored and logged. #
!
! --- Lines ------------------------------------------------------------------
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
line vty 0 4
 access-class MGMT-SSH in
 exec-timeout 10 0
 login local
 transport input ssh
line vty 5 15
 access-class MGMT-SSH in
 exec-timeout 10 0
 login local
 transport input ssh
!
end
