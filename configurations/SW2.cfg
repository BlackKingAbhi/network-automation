! =====================================================================
! SW2 - ACCESS SWITCH (Layer 2)
! Sanitized LAB configuration (sample) - NOT a backup of a real device.
! Target platform : Cisco IOSvL2 15.x (GNS3 / EVE-NG / Cisco CML)
! Status          : Lab-ready. Not verified on physical hardware.
!
! Before use:
!   * Replace every CHANGE_ME value with your own strong secret.
!   * Adapt 192.168.150.0/24 to YOUR lab management network.
!   * Never commit real passwords to Git.
! =====================================================================
!
hostname SW2
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
no ip domain-lookup
ip domain-name lab.local
!
! --- Local accounts --------------------------------------------------
enable algorithm-type scrypt secret CHANGE_ME_ENABLE_SECRET
username netadmin privilege 15 algorithm-type scrypt secret CHANGE_ME_ADMIN_PASSWORD
!
! --- SSH --------------------------------------------------------------
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
login block-for 120 attempts 3 within 60
!
! --- VLANs ------------------------------------------------------------
vtp mode transparent
!
vlan 10
 name USERS
!
vlan 20
 name SERVERS
!
vlan 99
 name MANAGEMENT
!
vlan 999
 name NATIVE_UNUSED
!
spanning-tree mode rapid-pvst
!
! --- Interfaces -------------------------------------------------------
interface GigabitEthernet0/0
 description Trunk to SW1 Gi0/1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20
 switchport mode trunk
 switchport nonegotiate
 no shutdown
!
interface GigabitEthernet0/1
 description Access port - PC1 (VLAN 10 USERS)
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet0/2
 description Access port - PC2 (VLAN 20 SERVERS)
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet0/3
 description Out-of-band management uplink (VLAN 99)
 switchport access vlan 99
 switchport mode access
 spanning-tree portfast edge
 no shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan99
 description Management SVI (example subnet 192.168.150.0/24)
 ip address 192.168.150.112 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.150.1
!
! --- Management access control -----------------------------------------
ip access-list standard MGMT-SSH
 permit 192.168.150.0 0.0.0.255
 deny   any log
!
no ip http server
no ip http secure-server
!
! --- Time and logging ----------------------------------------------------
ntp server 192.168.150.10
logging host 192.168.150.20
logging trap informational
!
banner motd # Authorized access only. All activity is monitored and logged. #
!
! --- Lines ------------------------------------------------------------------
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
line vty 0 4
 access-class MGMT-SSH in
 exec-timeout 10 0
 login local
 transport input ssh
line vty 5 15
 access-class MGMT-SSH in
 exec-timeout 10 0
 login local
 transport input ssh
!
end
