! SAMPLE BACKUP FILE - produced by 'netauto backup' against a local SSH simulator
! that served the sanitized R1 sample config. Password hashes are fake placeholders.
! Real backups contain real hashes and must stay in your PRIVATE backup repository.
!
version 15.9
!
hostname R1
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
no ip domain-lookup
ip domain-name lab.local
!
enable secret 9 $9$SIMULATEDHASH
username netadmin privilege 15 secret 9 $9$SIMULATEDHASH
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
login block-for 120 attempts 3 within 60
!
interface Loopback0
 description Router-ID
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description WAN link to R2 Gi0/0
 ip address 10.0.12.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/1
 description Trunk to SW1 Gi0/0 (router-on-a-stick)
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.10
 description Gateway VLAN 10 - USERS
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
!
interface GigabitEthernet0/1.20
 description Gateway VLAN 20 - SERVERS
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
!
interface GigabitEthernet0/2
 description UNUSED
 no ip address
 shutdown
!
interface GigabitEthernet0/3
 description Out-of-band management (example subnet 192.168.150.0/24)
 ip address 192.168.150.101 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
!
ip access-list standard MGMT-SSH
 permit 192.168.150.0 0.0.0.255
 deny   any log
!
no ip http server
no ip http secure-server
!
ntp server 192.168.150.10
logging host 192.168.150.20
logging trap informational
!
banner motd # Authorized access only. All activity is monitored and logged. #
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
line vty 0 4
 access-class MGMT-SSH in
 exec-timeout 10 0
 login local
 transport input ssh
line vty 5 15
 access-class MGMT-SSH in
 exec-timeout 10 0
 login local
 transport input ssh
!
end
