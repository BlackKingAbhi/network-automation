# Minimal packaging file so that 'pip install -e .' creates the 'netauto' command.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netauto"
version = "1.0.0"
description = "Network Configuration Backup & Security Auditing Automation for Cisco IOS"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["netmiko>=4.3,<5", "PyYAML>=6.0"]

[project.scripts]
netauto = "netauto.main:main"

[tool.setuptools]
packages = ["netauto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
